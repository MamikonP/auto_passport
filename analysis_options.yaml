# Enforces standard lint rules from the Flutter team
include: package:flutter_lints/flutter.yaml

analyzer:
  # Exclude auto-generated files from code analysis
  exclude:
    - "build/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  # Stronger type checks for safer production code
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  # Change how specific rules impact your build pipeline
  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore

linter:
  # Turn specific rules on or off on top of your included package
  rules:
    avoid_print: true
    prefer_single_quotes: true
    prefer_const_constructors: true
    use_key_in_widget_constructors: true
